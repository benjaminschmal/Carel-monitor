services:
  carel-monitor:
    image: ghcr.io/benjaminschmal/carel-monitor:latest
    container_name: carel-monitor-1
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CAREL_HOST: ""
      CAREL_PORT: "502"
      CAREL_SLAVE: "1"
      CAREL_TIMEOUT: "3"
      REGISTER_START: "0"
      REGISTER_END: "100"
      SCAN_INTERVAL: "5"
      MQTT_HOST: ""
      MQTT_PORT: "1883"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_BASE_TOPIC: "carel/monitor"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8000"
      LOG_LEVEL: "INFO"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
