services:
  carel-monitor:
    build: .
    container_name: carel-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CAREL_HOST: ${CAREL_HOST:-127.0.0.1}
      CAREL_PORT: ${CAREL_PORT:-502}
      CAREL_SLAVE: ${CAREL_SLAVE:-1}
      CAREL_TIMEOUT: ${CAREL_TIMEOUT:-3}
      REGISTER_START: ${REGISTER_START:-2}
      REGISTER_END: ${REGISTER_END:-209}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-5}
      DATA_DIR: /app/data
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-carel/monitor}
    volumes:
      - ./data:/app/data
